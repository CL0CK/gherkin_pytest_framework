[tool.poetry]
name = "playwright-bdd-framework"
version = "0.1.0"
description = "Playwright BDD testing framework with custom Gherkin parser and Allure reporting"
authors = ["Your Name <your.email@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
playwright = "^1.44.0"
pytest = "^8.2.0"
pytest-playwright = "^0.5.0"
allure-pytest = "^2.14.0"
pydantic-settings = "^2.3.0"
loguru = "^0.7.2"
pyyaml = "^6.0.1"

[tool.poetry.group.dev.dependencies]
ruff = "^0.4.0"
mypy = "^1.10.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"