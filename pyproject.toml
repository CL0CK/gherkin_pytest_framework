[tool.poetry]
name = "playwright-bdd-framework"
version = "0.1.0"
description = "Playwright BDD testing framework with custom Gherkin parser and Allure reporting"
authors = ["Vadym Dovgotko <mr.1cpu@gmail.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
playwright = "^1.44.0"
pytest = "^8.2.0"
pytest-playwright = "^0.5.0"
allure-pytest = "^2.14.0"
pydantic-settings = "^2.3.0"
loguru = "^0.7.2"
pyyaml = "^6.0.1"
axe-playwright-python = "^0.1.7"
pillow = "<11"

[tool.poetry.group.dev.dependencies]
ruff = "^0.4.0"
mypy = "^1.10.0"
pre-commit = "^3.8.0"
pytest-xdist = "^3.6.0"
matplotlib = "^3.8.0"
pillow = "^10.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# ============================================================================
# Ruff Configuration
# ============================================================================

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".bzr", ".direnv", ".eggs", ".git", ".git-rewrite", ".hg",
    ".ipynb_checkpoints", ".mypy_cache", ".nox", ".pants.d", ".pyenv",
    ".pytest_cache", ".pytype", ".ruff_cache", ".svn", ".tox",
    ".venv", ".vscode", "__pypackages__", "_build", "buck-out",
    "build", "dist", "node_modules", "site-packages", "venv",
]

[tool.ruff.lint]
select = [
    "F",        # Pyflakes
    "E",        # pycodestyle errors
    "W",        # pycodestyle warnings
    "I",        # isort (import sorting)
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "SIM",      # flake8-simplify
    "C4",       # flake8-comprehensions
    "RUF",      # Ruff-specific
    "N",        # pep8-naming
]
ignore = [
    "E203",
    "SIM108",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"tests/*" = ["F401", "F811", "S101"]
"scripts/*" = ["T201"]
"utils/steps_wrapper.py" = ["N802"]

[tool.ruff.lint.isort]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
known-first-party = ["utils", "pages", "tests"]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ============================================================================
# Mypy Configuration
# ============================================================================

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
show_error_context = true
show_column_numbers = true
pretty = true
cache_dir = ".mypy_cache"
incremental = true
exclude = ["conftest\\.py$"]

# ============================================================================
# Pytest Configuration
# ============================================================================

[tool.pytest.ini_options]
markers = [
    "smoke: smoke tests",
    "regression: regression tests",
    "critical: critical path tests",
]
addopts = [
    "--strict-markers",
    "--tb=short",
    "--alluredir=allure-results",
    "--clean-alluredir",
    "-v",
    "-s",
    "-n", "auto",
]
testpaths = "tests"