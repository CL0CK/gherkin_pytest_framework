name: Unimplemented Scenarios Check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Check unimplemented scenarios
        run: poetry run python scripts/check_unimplemented.py | tee unimplemented-check.txt

      - name: Upload check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unimplemented-check-results
          path: unimplemented-check.txt
          retention-days: 30
