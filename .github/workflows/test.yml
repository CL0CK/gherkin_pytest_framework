name: Playwright BDD Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_filter:
        description: "pytest filter (e.g. -m smoke, tests/login/, test_view_products)"
        required: false
        default: ""
      browser:
        description: "browser to test"
        required: false
        default: "chromium"
        type: choice
        options:
          - chromium
          - firefox
          - webkit
          - all

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py311-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            venv-${{ runner.os }}-py311-

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run ruff
        run: poetry run ruff check .

      - name: Run mypy
        run: poetry run mypy .

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(github.event_name == 'workflow_dispatch' && github.event.inputs.browser == 'all' && '["chromium", "firefox", "webkit"]' || format('["{0}"]', github.event.inputs.browser || 'chromium')) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py311-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            venv-${{ runner.os }}-py311-

      - name: Install project and dependencies
        run: poetry install --no-interaction

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: poetry run playwright install --with-deps ${{ matrix.browser }}

      - name: Run tests
        env:
          BASE_URL: https://www.saucedemo.com
          BROWSER: ${{ matrix.browser }}
          HEADLESS: true
          SLOW_MO: 0
          SCREENSHOT_ON_FAILURE: true
          VIDEO_ON_FAILURE: true
        run: poetry run pytest tests/ -v --tb=short ${{ github.event.inputs.test_filter }}

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-${{ matrix.browser }}
          path: allure-results/
          retention-days: 7

  publish-reports:
    needs: test
    if: ${{ !cancelled() && needs.test.result != 'skipped' }}
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py311-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            venv-${{ runner.os }}-py311-

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Download all results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results-merged
          merge-multiple: true

      - name: Get previous Allure history and results
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Generate test report
        run: |
          poetry run python scripts/generate_test_report.py allure-results-merged \
            --previous gh-pages/last_result.json \
            --branch "${{ github.ref_name }}" \
            --browser "${{ github.event.inputs.browser || 'chromium' }}"

      - name: Ensure gh-pages folder exists
        run: mkdir -p gh-pages

      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@v1.14
        with:
          allure_results: allure-results-merged
          allure_report: allure-report
          gh_pages: gh-pages
          allure_history: allure-history
          keep_reports: 20

      - name: Prepare last_result for deployment
        run: |
          # Возвращаем права на папку обычному пользователю раннера
          sudo chown -R $USER:$USER allure-history
          
          mkdir -p allure-history
          if [ -f reports/last_result.json ]; then
            cp reports/last_result.json allure-history/last_result.json
          elif [ -f gh-pages/last_result.json ]; then
            cp gh-pages/last_result.json allure-history/last_result.json
          fi
      - name: Persist Allure history and last_result to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

      - name: Upload Allure Report artifact
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-history/
          retention-days: 14

      - name: Upload test report artifact (PNG)
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: reports/test-report.png
          retention-days: 30
          if-no-files-found: ignore

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./allure-history

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4